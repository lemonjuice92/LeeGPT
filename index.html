<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeeGPT ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="logo">🦋 LeeGPT</div>
        <div class="subtitle">Made with ❤️ by Leeman</div>
    </header>

    <main id="chat" class="chat">
    </main>

    <div id="typing" class="typing">
        LeeGPT is typing...
    </div>

    <footer class="bottom">

        <input
            type="text"
            id="message"
            placeholder="Message LeeGPT..."
            autocomplete="off"
            onkeydown="if(event.key==='Enter'){sendMessage();}"
        >

        <button type="button" onclick="sendMessage()">
            ➤
        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
