<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeeGPT ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="logo">
            🦋 LeeGPT
        </div>

        <div class="subtitle">
            Made with ❤️ by Leeman
        </div>

    </div>

    <div id="chat" class="chat"></div>

    <div id="typing" class="typing">
        LeeGPT is typing...
    </div>

    <div class="bottom">

        <input
            id="message"
            type="text"
            autocomplete="off"
            placeholder="Message LeeGPT..."
            onkeydown="if(event.key==='Enter'){sendMessage();}"
        >

        <button onclick="sendMessage()">
            ➜
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
