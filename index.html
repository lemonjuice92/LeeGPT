
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeeGPT ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>LeeGPT ❤️</h1>
        <p>Always here for you, Selam.</p>
    </div>

    <div id="chatBox" class="chat-box">

        <div class="bot-message">
            Hi Selam 👋❤️<br><br>

            I'm <b>LeeGPT</b>.

            Ask me anything. I'll always try to help, make you smile, and remind you that Leeman cares about you.
        </div>

    </div>

    <div class="input-area">
        <input
            id="userInput"
            type="text"
            placeholder="Message LeeGPT..."
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
